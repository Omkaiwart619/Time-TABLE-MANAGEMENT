{% extends 'scheduler/base.html' %}
{% block title %}Departments{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Departments</h3>
    <a href="{% url 'department_add' %}" class="btn btn-primary">+ Add Department</a>
</div>
<table class="table table-bordered bg-white">
    <thead>
        <tr><th>Name</th><th>Code</th><th>Action</th></tr>
    </thead>
    <tbody>
        {% for d in departments %}
        <tr>
            <td>{{ d.name }}</td>
            <td>{{ d.code }}</td>
            <td><a href="{% url 'department_delete' d.pk %}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this department?')">Delete</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center text-muted">No departments yet.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
